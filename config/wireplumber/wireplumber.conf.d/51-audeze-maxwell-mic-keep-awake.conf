# The Audeze Maxwell turns its microphone link off when the dongle's capture
# device closes, and needs a second or more to wake it again. Keep the capture
# device open for 10 minutes after the last recording so repeated dictation
# starts instantly.
monitor.alsa.rules = [
  {
    matches = [
      {
        node.name = "~alsa_input.usb-Audeze_LLC_Audeze_Maxwell_Dongle.*"
      }
    ]
    actions = {
      update-props = {
        session.suspend-timeout-seconds = 600
      }
    }
  }
]
